services:
  postgres:
    image: postgres:16-alpine
    container_name: byakuya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-byakuya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-byakuya_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-byakuya}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - byakuya_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-byakuya} -d $${POSTGRES_DB:-byakuya}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  byakuya_pgdata:
